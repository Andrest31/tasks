<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1742"/>
      <stop offset="0.45" stop-color="#171634"/>
      <stop offset="1" stop-color="#080a18"/>
    </linearGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#292447"/>
      <stop offset="1" stop-color="#111426"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17192e"/>
      <stop offset="1" stop-color="#090b16"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="50%" cy="15%" r="65%">
      <stop offset="0" stop-color="#8a5db9" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#553e83" stop-opacity=".07"/>
      <stop offset="1" stop-color="#080a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72608f" stop-opacity="0"/>
      <stop offset=".28" stop-color="#80729d" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#9b8aaa" stop-opacity=".08"/>
      <stop offset=".82" stop-color="#77648e" stop-opacity=".13"/>
      <stop offset="1" stop-color="#77648e" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#violetGlow)"/>

  <g fill="#d6c9ff" opacity=".46">
    <circle cx="78" cy="89" r="1.1"/><circle cx="171" cy="178" r=".9"/><circle cx="271" cy="81" r=".8"/>
    <circle cx="382" cy="143" r="1"/><circle cx="501" cy="65" r=".9"/><circle cx="628" cy="119" r=".7"/>
    <circle cx="735" cy="76" r="1.1"/><circle cx="846" cy="158" r=".8"/><circle cx="957" cy="88" r=".7"/>
    <circle cx="1087" cy="135" r="1.1"/><circle cx="1196" cy="69" r=".8"/><circle cx="1321" cy="121" r=".9"/>
    <circle cx="1439" cy="78" r=".7"/><circle cx="1560" cy="159" r="1.1"/><circle cx="1684" cy="93" r=".8"/>
    <circle cx="1811" cy="137" r="1"/><circle cx="133" cy="271" r=".8"/><circle cx="322" cy="235" r=".7"/>
    <circle cx="726" cy="240" r=".9"/><circle cx="1135" cy="227" r=".8"/><circle cx="1510" cy="246" r=".7"/>
  </g>

  <!-- distant Caucasus-like ridge -->
  <path d="M0 402 L95 365 L170 329 L241 343 L317 282 L377 303 L454 214 L502 260 L566 182 L624 259 L691 222 L758 301 L829 268 L900 326 L971 294 L1045 344 L1124 303 L1200 224 L1262 265 L1326 188 L1385 245 L1462 291 L1530 258 L1601 337 L1671 300 L1745 355 L1821 317 L1920 374 L1920 1080 L0 1080 Z" fill="url(#ridge1)"/>
  <path d="M0 433 L102 390 L170 358 L241 374 L317 311 L377 332 L454 244 L502 287 L566 211 L624 290 L691 254 L758 329 L829 298 L900 353 L971 325 L1045 372 L1124 334 L1200 252 L1262 292 L1326 219 L1385 272 L1462 321 L1530 287 L1601 363 L1671 329 L1745 382 L1821 347 L1920 401" fill="none" stroke="#9a6aaa" stroke-opacity=".23" stroke-width="5"/>

  <!-- haze -->
  <ellipse cx="960" cy="500" rx="820" ry="120" fill="url(#mist)" filter="url(#blur)"/>
  <ellipse cx="1230" cy="610" rx="590" ry="90" fill="url(#mist)" opacity=".65" filter="url(#blur)"/>

  <!-- foreground forest/ridge -->
  <path d="M0 615 L81 575 L150 603 L229 555 L301 590 L372 528 L456 574 L544 535 L621 596 L709 551 L800 614 L884 567 L974 628 L1057 581 L1148 646 L1230 604 L1314 665 L1403 610 L1490 670 L1580 619 L1670 688 L1760 633 L1842 681 L1920 650 L1920 1080 L0 1080 Z" fill="url(#ridge2)"/>
