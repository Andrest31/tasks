  <!-- sparse warm village lights -->
  <g fill="#d69b62" opacity=".58">
    <circle cx="1546" cy="692" r="2.1"/><circle cx="1580" cy="707" r="1.6"/><circle cx="1603" cy="684" r="1.8"/>
    <circle cx="1644" cy="721" r="2"/><circle cx="1681" cy="699" r="1.5"/><circle cx="1718" cy="728" r="1.9"/>
    <circle cx="1760" cy="704" r="1.5"/><circle cx="1810" cy="731" r="1.7"/>
  </g>
</svg>
